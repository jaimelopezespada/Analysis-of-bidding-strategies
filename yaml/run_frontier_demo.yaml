# ------------------------------------------------------------------
# Demo de barrido de beta / frontera beneficio-riesgo.
# ------------------------------------------------------------------

mode: stochastic
resolution: 24

order_types: [simple, sco, sbo, exbo, lsbo]

prices:
  csv_path: data/example_omie.csv
  scenario_mode: per_day

objective:
  beta: 0.0

cvar_alpha: 0.95

candidate_grid:
  price_levels_pct:    [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]
  mar_levels:          [0.0, 0.3, 0.5, 0.8, 1.0]
  mav_fraction_levels: [0.0, 0.5, 0.8, 1.0]
  tf_levels:           [0]

beta_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]

output_dir: results
seed: 42

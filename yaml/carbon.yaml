# ------------------------------------------------------------------
# Carbon — Familia 3 (programable, coste alto)
# Unidad de ~400 MW. Combustible + CO2 caros, arranque costoso, minimo
# tecnico alto y rampa lenta (mas rigida que CCGT). Contraste dentro de F3.
# Valores ORIENTATIVOS: ajustar y citar fuente en la memoria.
# ------------------------------------------------------------------
name: "Carbon 400 MW"
family: 3
side: sell

# Coste variable = combustible + CO2.
variable_cost: 100.0       # €/MWh
startup_cost: 100000.0     # € — arranque mas costoso que CCGT (inercia termica del generador de vapor)
technical_min: 160.0      # MWh — ~40% de la capacidad (minimo tecnico mas alto que CCGT)
enforce_technical_constraints: true  # activa el minimo tecnico como restriccion real del MILP

# Q̄_t: capacidad disponible cada hora (despachable -> capacidad plena). Longitud = 24.
availability:
  values: [400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400]

# price_levels centrados en 65 (coste variable). tf_levels en torno al coste
# de arranque (25 000 €), la SCO protege ese arranque con la MIC.
# mar_levels/mav_fraction_levels: technical_min=160 sobre 400 MW de capacidad
# -> floor = 160/400 = 0.40. La planta solo despacha 0 o >= 160 MW, nunca un
# valor intermedio, asi que ningun nivel puede caer por debajo de 0.40 (ni
# siquiera 0.0: ver TechnologyConfig.effective_grid).
candidate_grid:
  price_levels:        [50, 80, 95, 100, 105, 110, 120]
  mar_levels:          [0.40, 0.5, 0.8, 1.0]
  mav_fraction_levels: [0.40, 0.5, 0.8, 1.0]
  tf_levels:           [0, 14000, 20000, 22400, 24000, 27400, 30000, 34000, 40000, 60000]

# EXBO: dos niveles de compromiso mutuamente excluyentes (casa como maximo
# uno) — quedarse en el minimo tecnico (220 MW, mas facil de casar dado el
# arranque caro) frente a comprometerse a plena carga (400 MW). Alternativa
# discreta, distinta de la LSBO de abajo (que es aditiva: base + paquete
# opcional).
exbo_groups:
  - group_id: "carbon_commitment_choice"
    blocks:
      - id: "minimo_tecnico_block"
        price_levels: [50, 80, 95, 100, 105, 110, 120]
        availability:
          values: [160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160]
      - id: "plena_carga_block"
        price_levels: [50, 80, 95, 100, 105, 110, 120]
        availability:
          values: [400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400]

# LSBO. El padre es el propio minimo tecnico (220 MW, "programa minimo"
# imprescindible para casar) y el hijo es la capacidad restante hasta plena
# carga (280 MW, paquete adicional y opcional), reflejando directamente
# technical_min.
lsbo_families:
  - family_id: "carbon_base_plus_full"
    parent:
      id: "base_minimo_tecnico"
      price_levels: [50, 80, 95, 100, 105, 110, 120]
      availability:
        values: [160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160, 160]
    children:
      - id: "extra_plena_carga"
        price_levels: [50, 80, 95, 100, 105, 110, 120]
        availability:
          values: [240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240, 240]

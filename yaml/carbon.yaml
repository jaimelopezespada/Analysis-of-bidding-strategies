# ------------------------------------------------------------------
# Carbon — Familia 3 (programable, coste alto)
# Unidad de ~500 MW. Combustible + CO2 caros, arranque costoso, minimo
# tecnico alto y rampa lenta (mas rigida que CCGT). Contraste dentro de F3.
# Valores ORIENTATIVOS: ajustar y citar fuente en la memoria.
# ------------------------------------------------------------------
name: "Carbon 500 MW"
family: 3
side: sell

# Coste variable = combustible + CO2 + O&M.
# Combustible ~20 €/MWh_el + CO2 ~35 €/MWh_el (EUA ~90 €/t, factor emision
# ~0.35-0.39 tCO2/MWh_el) + O&M ~10 €/MWh_el.
variable_cost: 65.0       # €/MWh
startup_cost: 25000.0     # € — arranque mas costoso que CCGT (inercia termica del generador de vapor)
technical_min: 220.0      # MWh — ~44% de la capacidad (minimo tecnico mas alto que CCGT)
ramp_limit: 110.0         # MWh/hora — mas lento que CCGT (250 MWh/h); solo caracterizacion cualitativa, NO se aplica (ver optimizer.py)
enforce_technical_constraints: true  # activa el minimo tecnico como restriccion real del MILP

# Q̄_t: capacidad disponible cada hora (despachable -> capacidad plena). Longitud = 24.
availability:
  values: [500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500]

# price_levels centrados en 65 (coste variable). tf_levels en torno al coste
# de arranque (25 000 €), la SCO protege ese arranque con la MIC.
# mar_levels/mav_fraction_levels: technical_min=220 sobre 500 MW de capacidad
# -> floor = 220/500 = 0.44. La planta solo despacha 0 o >= 220 MW, nunca un
# valor intermedio, asi que ningun nivel puede caer por debajo de 0.44 (ni
# siquiera 0.0: ver TechnologyConfig.effective_grid).
candidate_grid:
  price_levels:        [50, 55, 60, 65, 70, 75, 85]
  mar_levels:          [0.44, 0.5, 0.8, 1.0]
  mav_fraction_levels: [0.44, 0.5, 0.8, 1.0]
  tf_levels:           [0, 10000, 25000, 40000, 60000]

# EXBO: dos niveles de compromiso mutuamente excluyentes (casa como maximo
# uno) — quedarse en el minimo tecnico (220 MW, mas facil de casar dado el
# arranque caro) frente a comprometerse a plena carga (500 MW). Alternativa
# discreta, distinta de la LSBO de abajo (que es aditiva: base + paquete
# opcional).
exbo_groups:
  - group_id: "carbon_commitment_choice"
    blocks:
      - id: "minimo_tecnico_block"
        price_levels: [50, 55, 60, 65]
        availability:
          values: [220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220]
      - id: "plena_carga_block"
        price_levels: [60, 65, 70, 75]
        availability:
          values: [500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500]

# LSBO. El padre es el propio minimo tecnico (220 MW, "programa minimo"
# imprescindible para casar) y el hijo es la capacidad restante hasta plena
# carga (280 MW, paquete adicional y opcional), reflejando directamente
# technical_min.
lsbo_families:
  - family_id: "carbon_base_plus_full"
    parent:
      id: "base_minimo_tecnico"
      price_levels: [50, 60, 65, 70]
      availability:
        values: [220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220, 220]
    children:
      - id: "extra_plena_carga"
        price_levels: [55, 60, 65, 70, 75]
        availability:
          values: [280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280]

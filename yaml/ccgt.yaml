# ------------------------------------------------------------------
# Ciclo combinado (CCGT) — Familia 3 (programable, coste alto)
# Unidad de ~400 MW. Combustible caro + coste de arranque + minimo tecnico.
# Es el caso estrella para SCO (ingresos minimos) y SBO (encender/no encender).
# Valores ORIENTATIVOS: ajustar (gas + CO2) y citar fuente.
# ------------------------------------------------------------------
name: "CCGT 400 MW"
family: 3
side: sell

variable_cost: 85.0       # €/MWh — coste variable (gas + CO2)
startup_cost: 60000.0     # € — arranque considerable
technical_min: 120.0      # MWh — ~30% de la capacidad (no convexidad)
enforce_technical_constraints: true  # activa el minimo tecnico como restriccion real del MILP

# Q̄_t: capacidad disponible cada hora (despachable -> capacidad plena).
# El modelo decide cuanto ofertar. Longitud = 24.
availability:
  values: [400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400]

# C_V=75 €/MWh, C_SU=60 000 €.
# price_levels: centrados en 75 (coste variable exacto). Valores por debajo
# implican despachar a perdida; valores muy por encima reducen las horas casadas.
# tf_levels: en torno a C_SU=60 000 €. La SCO protege el arranque con la MIC.
# mar_levels/mav_fraction_levels: technical_min=120 sobre 400 MW de capacidad
# -> floor = 120/400 = 0.30. La planta solo despacha 0 o >= 120 MW, nunca un
# valor intermedio, asi que ningun nivel puede caer por debajo de 0.30 (ni
# siquiera 0.0: ver TechnologyConfig.effective_grid).
candidate_grid:
  price_levels:        [60, 70, 83, 85, 87, 90]
  mar_levels:          [0.3, 0.4, 0.5, 0.8, 1.0]
  mav_fraction_levels: [0.3, 0.5, 0.8, 1.0]
  tf_levels:           [0, 10000, 20000, 55000, 60000, 65000, 70000, 80000, 90000]

# EXBO: dos niveles de compromiso mutuamente excluyentes (casa como maximo
# uno) — quedarse en el minimo tecnico (120 MW, mas facil de casar) frente a
# comprometerse a plena carga (400 MW). Alternativa discreta, distinta de la
# LSBO de abajo (que es aditiva: base + paquete opcional).
exbo_groups:
  - group_id: "ccgt_commitment_choice"
    blocks:
      - id: "minimo_tecnico_block"
        price_levels: [60, 70, 83, 85, 87, 90]
        availability:
          values: [120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120]
      - id: "plena_carga_block"
        price_levels: [60, 70, 83, 85, 87, 90]
        availability:
          values: [400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400, 400]

# LSBO. El padre es el propio minimo tecnico (120 MW, "programa minimo"
# imprescindible para casar) y el hijo es la capacidad restante hasta plena
# carga (280 MW, paquete adicional y opcional), reflejando directamente
# technical_min.
lsbo_families:
  - family_id: "ccgt_base_plus_full"
    parent:
      id: "base_minimo_tecnico"
      price_levels: [60, 70, 83, 85, 87, 90]
      availability:
        values: [120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120, 120]
    children:
      - id: "extra_plena_carga"
        price_levels: [60, 70, 83, 85, 87, 90]
        availability:
          values: [280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280, 280]

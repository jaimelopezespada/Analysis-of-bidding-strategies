# ------------------------------------------------------------------
# Configuracion de ejecucion — demo EXBO/LSBO.
# Usar solo con tecnologias que declaren exbo_groups/lsbo_families en su YAML
# (por ahora: solar_fv.yaml, bateria.yaml). Con otras tecnologias fallara con
# un error claro ("no exbo_groups/lsbo_families configured").
# ------------------------------------------------------------------

mode: stochastic
resolution: 24

order_types: [simple, sbo, exbo, lsbo]

prices:
  csv_path: data/example_omie.csv
  scenario_mode: per_day

objective:
  beta: 0.0

cvar_alpha: 0.95

candidate_grid:
  price_levels:        [0, 1, 5, 10, 20, 40, 60, 80]
  mar_levels:          [0.0, 0.3, 0.5, 0.8, 1.0]
  mav_fraction_levels: [0.0, 0.5, 0.8, 1.0]
  tf_levels:           [0, 50, 100, 200, 500]

output_dir: results
seed: 42

# ------------------------------------------------------------------
# Configuracion de ejecucion — ajustar segun el analisis deseado
# ------------------------------------------------------------------

mode: stochastic          # deterministic | stochastic
resolution: 24            # 24 (horario) | 96 (cuartohorario)

order_types: [simple, sco, sbo, exbo, lsbo]

prices:
  csv_path: data/example_omie.csv
  scenario_mode: per_day
  # date_range: ["2025-01-01", "2025-03-31"]   # opcional: filtrar fechas

objective:
  beta: 0.0               # max (1-beta)*E[Pi] + beta*CVaR_alpha; beta=0 -> beneficio esperado puro

cvar_alpha: 0.95

candidate_grid:
  price_levels_pct:    [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]   # x referencia de precio de la tecnologia (coste variable o price_reference)
  mar_levels:          [0.0, 0.3, 0.5, 0.8, 1.0]       # SBO
  mav_fraction_levels: [0.0, 0.5, 0.8, 1.0]            # SCO: MAV como fraccion de Q̂_t
  tf_levels:           [0, 50, 100, 200, 500]           # SCO: termino fijo €

output_dir: results
seed: 42

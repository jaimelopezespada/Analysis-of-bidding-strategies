# ------------------------------------------------------------------
# Configuracion de ejecucion — AÑO COMPLETO may 2025 - abr 2026 (datos reales OMIE/ESIOS)
# ------------------------------------------------------------------

mode: stochastic          # deterministic | stochastic
resolution: 24            # 24 (horario) | 96 (cuartohorario)

order_types: [simple, sco, sbo, exbo, lsbo]

prices:
  csv_path: data/precios_omie_2025-05-01_2026-04-30_hour.csv
  scenario_mode: per_day
  renewable_csv_path: data/generacion_renovable_2025-05-01_2026-04-30_hour.csv

objective:
  beta: 0.5               # max (1-beta)*E[Pi] + beta*CVaR_alpha

cvar_alpha: 0.95

candidate_grid:
  price_levels_pct:    [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]   # x referencia de precio de la tecnologia (coste variable o price_reference)
  mar_levels:          [0.0, 0.3, 0.5, 0.8, 1.0]       # SBO
  mav_fraction_levels: [0.0, 0.5, 0.8, 1.0]            # SCO: MAV como fraccion de Q̂_t
  tf_levels:           [0, 50, 100, 200, 500]           # SCO: termino fijo €

output_dir: results
season: anual             # namespaces results/anual/<tecnologia>/ para no chocar con verano/invierno
seed: 42

# Cobrar un arranque por cada transicion cero->produccion en vez de uno solo
# al dia (solo afecta a ofertas simples; los bloques son contiguos).
startup_per_transition: true

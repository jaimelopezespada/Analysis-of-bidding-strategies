# ------------------------------------------------------------------
# Configuracion de ejecucion — demo EXBO/LSBO con datos reales de verano.
# Pensado para solar_fv.yaml (que declara exbo_groups/lsbo_families y usa
# disponibilidad renovable real).
# ------------------------------------------------------------------

mode: stochastic
resolution: 24

order_types: [simple, sbo, exbo, lsbo]

prices:
  csv_path: data/precios_omie_2025-06-01_2025-08-31_hour.csv
  scenario_mode: per_day
  renewable_csv_path: data/generacion_renovable_2025-06-01_2025-08-31_hour.csv

objective:
  beta: 0.0

cvar_alpha: 0.95

candidate_grid:
  price_levels:        [0, 1, 5, 10, 20, 40, 60, 80]
  mar_levels:          [0.0, 0.3, 0.5, 0.8, 1.0]
  mav_fraction_levels: [0.0, 0.5, 0.8, 1.0]
  tf_levels:           [0, 50, 100, 200, 500]

output_dir: results
seed: 42

# ------------------------------------------------------------------
# Nuclear — Familia 2 (programable, coste bajo) pero casi inflexible (baseload)
# Reactor de ~1000 MW. Combustible barato, arranque carisimo, minimo tecnico
# muy alto y gradiente lento -> en la practica opera como "must-run".
# Sirve de CONTRASTE frente a las tecnologias flexibles.
# Valores ORIENTATIVOS: ajustar y citar fuente.
# ------------------------------------------------------------------
name: "Nuclear 1000 MW"
family: 2
side: sell

variable_cost: 15.0       # €/MWh — combustible muy barato
startup_cost: 500000.0    # € — arranque carisimo (penaliza apagar/encender) 
technical_min: 500.0      # MWh — opera mitad de plena carga (muy inflexible)
enforce_technical_constraints: true  # activa el minimo tecnico como restriccion real del MILP

# Q̄_t: capacidad disponible cada hora. Longitud = 24.
availability:
  values: [1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000]

# C_V=15 €/MWh, C_SU=500 000 €.
# price_levels_pct: fracciones del coste variable (1.0 = ofertar al coste
# exacto); x15 -> [0, 5, 8, 10, 12, 14, 16, 18, 20, 25, 30] €/MWh. Nuclear
# casi siempre oferta a precio bajo para asegurar despacho (must-run), pero
# no a 0 para no perder.
# tf_levels: en torno al coste de arranque (500 000 €). Nuclear raramente apaga,
# pero si lo hace necesita cubrir ese coste enorme.
# mar_levels/mav_fraction_levels: technical_min=500 sobre 1000 MW de capacidad
# -> floor = 500/1000 = 0.5. La planta solo despacha 0 o >= 500 MW, nunca un
# valor intermedio, asi que ningun nivel puede caer por debajo de 0.95 (ni
# siquiera 0.0: ver TechnologyConfig.resolved_grid).
candidate_grid:
  price_levels_pct:    [0.0, 0.3333, 0.5333, 0.6667, 0.8, 0.9333, 1.0667, 1.2, 1.3333, 1.6667, 2.0]
  mar_levels:          [0.5, 0.55, 0.6, 0.7]
  mav_fraction_levels: [0.5, 0.55, 0.6, 0.7]
  tf_levels:           [0, 200000, 300000, 400000, 450000, 500000, 550000, 1000000]

# EXBO: dos niveles de compromiso mutuamente excluyentes (casa como maximo
# uno) — quedarse en el minimo tecnico (500 MW, mas facil de casar) frente a
# comprometerse a plena carga (1000 MW). Alternativa discreta, distinta de la
# LSBO de abajo (que es aditiva: base + paquete opcional).
exbo_groups:
  - group_id: "nuclear_commitment_choice"
    blocks:
      - id: "minimo_tecnico_block"
        price_levels_pct: [0.0, 0.3333, 0.6667, 0.9333, 1.0, 1.0667, 1.3333]
        availability:
          values: [500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500]
      - id: "plena_carga_block"
        price_levels_pct: [0.0, 0.3333, 0.6667, 0.9333, 1.0, 1.0667, 1.3333]
        availability:
          values: [1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000]

# LSBO. El padre es el propio minimo tecnico (500 MW, "programa minimo"
# imprescindible para casar) y el hijo es la capacidad restante hasta plena
# carga (500 MW, paquete adicional y opcional), reflejando directamente
# technical_min.
lsbo_families:
  - family_id: "nuclear_base_plus_full"
    parent:
      id: "base_minimo_tecnico"
      price_levels_pct: [0.0, 0.3333, 0.6667, 0.9333, 1.0, 1.0667, 1.3333]
      availability:
        values: [500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500]
    children:
      - id: "extra_plena_carga"
        price_levels_pct: [0.0, 0.3333, 0.6667, 0.9333, 1.0, 1.0667, 1.3333]
        availability:
          values: [500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500]
